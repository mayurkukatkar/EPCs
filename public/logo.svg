<svg width="500" height="300" viewBox="130 20 240 230" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Sun Rays -->
  <g stroke="#f39c12" stroke-width="4">
    <line x1="250" y1="60" x2="250" y2="30"/>
    <line x1="220" y1="65" x2="200" y2="40"/>
    <line x1="280" y1="65" x2="300" y2="40"/>
    <line x1="200" y1="80" x2="170" y2="65"/>
    <line x1="300" y1="80" x2="330" y2="65"/>
  </g>

  <!-- Roof Shape -->
  <polygon points="150,120 250,60 350,120" fill="#f39c12"/>
  
  <!-- Green Accent -->
  <polygon points="150,120 250,90 350,120" fill="#2e7d32"/>

  <!-- Leaf Circle -->
  <circle cx="250" cy="140" r="20" fill="#2e7d32"/>
  <path d="M240 140 Q250 120 260 140 Q250 160 240 140 Z" fill="white"/>

  <!-- Company Name -->
  <text x="250" y="200" text-anchor="middle" font-size="48" font-family="Arial, sans-serif" fill="#555">
    EKVARTA
  </text>

  <!-- Tagline -->
  <text x="250" y="240" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#777">
    ENERGY SOLUTIONS
  </text>

</svg>
